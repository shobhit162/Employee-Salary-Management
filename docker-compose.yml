services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: employee_management
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - database-data:/var/lib/postgresql/data
    ports:
      # Exposed for local inspection with psql; remove for a real deployment.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://database:5432/employee_management
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-local-development-signing-secret-change-me}
      HR_USERNAME: ${HR_USERNAME:-hr.manager@acme.com}
      HR_PASSWORD: ${HR_PASSWORD:-ChangeMe123!}
      # Seeds 10,000 employees on the first start; skipped once data exists.
      SEED_ENABLED: ${SEED_ENABLED:-true}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  database-data:
