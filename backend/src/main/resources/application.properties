spring.application.name=employee-management

# --------------------------------------------------
# Database
# --------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/employee_management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --------------------------------------------------
# JPA / Hibernate
# --------------------------------------------------
# Flyway owns the schema. `validate` makes a drift between the entities and the
# migrations fail at startup instead of silently altering a production database.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --------------------------------------------------
# Flyway
# --------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --------------------------------------------------
# Server
# --------------------------------------------------
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never

# --------------------------------------------------
# Actuator - only health is exposed; salary data must not leak through /actuator
# --------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# --------------------------------------------------
# Security
# --------------------------------------------------
# The default secret and password exist so the app starts on a clean checkout.
# Both MUST be overridden by environment variables in any shared environment.
app.security.jwt.secret=${JWT_SECRET:local-development-signing-secret-change-me}
app.security.jwt.ttl=8h
app.security.users[0].username=${HR_USERNAME:hr.manager@acme.com}
app.security.users[0].password=${HR_PASSWORD:ChangeMe123!}
app.security.users[0].role=HR_MANAGER
app.security.users[0].display-name=ACME HR Manager
app.security.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200}

# --------------------------------------------------
# Exchange rates: units of each currency per 1 unit of the base currency.
# Static by design - see docs/trade-offs.md.
# --------------------------------------------------
app.exchange-rates.base=USD
app.exchange-rates.reporting=USD
app.exchange-rates.rates.USD=1.00
app.exchange-rates.rates.EUR=0.92
app.exchange-rates.rates.GBP=0.79
app.exchange-rates.rates.INR=83.20
app.exchange-rates.rates.SGD=1.35
app.exchange-rates.rates.AUD=1.52
app.exchange-rates.rates.CAD=1.36
app.exchange-rates.rates.BRL=5.05
app.exchange-rates.rates.PLN=3.98
app.exchange-rates.rates.AED=3.67
