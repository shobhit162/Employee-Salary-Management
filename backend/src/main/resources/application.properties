spring.application.name=employee-management

# --------------------------------------------------
# Database
# --------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/employee_management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --------------------------------------------------
# JPA / Hibernate
# --------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# --------------------------------------------------
# Flyway
# --------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --------------------------------------------------
# Server
# --------------------------------------------------
server.port=8080
# --------------------------------------------------
# Exchange rates: units of each currency per 1 unit of the base currency.
# Static by design - see docs/trade-offs.md.
# --------------------------------------------------
app.exchange-rates.base=USD
app.exchange-rates.reporting=USD
app.exchange-rates.rates.USD=1.00
app.exchange-rates.rates.EUR=0.92
app.exchange-rates.rates.GBP=0.79
app.exchange-rates.rates.INR=83.20
app.exchange-rates.rates.SGD=1.35
app.exchange-rates.rates.AUD=1.52
app.exchange-rates.rates.CAD=1.36
app.exchange-rates.rates.BRL=5.05
app.exchange-rates.rates.PLN=3.98
app.exchange-rates.rates.AED=3.67
