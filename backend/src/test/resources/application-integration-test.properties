# Datasource comes from the Testcontainers @ServiceConnection.
app.seed.enabled=false

app.security.jwt.secret=integration-test-signing-secret-not-a-real-one
app.security.users[0].username=hr.manager@acme.test
app.security.users[0].password=test-password
app.security.users[0].role=HR_MANAGER

# Deliberately round rates so converted amounts are exact and assertions stay
# readable. The real rates live in application.properties.
app.exchange-rates.base=USD
app.exchange-rates.reporting=USD
app.exchange-rates.rates.USD=1
app.exchange-rates.rates.EUR=0.5
app.exchange-rates.rates.GBP=0.25
app.exchange-rates.rates.INR=100

logging.level.org.testcontainers=WARN
logging.level.com.github.dockerjava=WARN
